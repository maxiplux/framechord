[package]
name = "framechord"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
description = "Local, agent-friendly media generation with reusable identities"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
schemars = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
fs4 = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
base64 = "0.22"
dotenvy = "0.15"
indicatif = "0.18"
console = "0.16"
async-trait = "0.1"
hound = "3"
symphonia = { version = "0.5", features = ["mp3", "flac", "pcm", "wav"] }
rubato = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rmp-serde = "1.3.1"
serde_bytes = "0.11.19"
ebur128 = "0.1.10"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
self-replace = "1.5"
semver = "1"
mp3lame-encoder = { version = "0.2.5", optional = true }
id3 = { version = "1.17.2", optional = true }

[dev-dependencies]
http-body-util = "0.1"
assert_cmd = "2"
portable-pty = "0.9.0"

[features]
default = ["mp3"]
# Statically links LAME (LGPL); see assets/THIRD_PARTY_NOTICES.md. Build with
# --no-default-features for a binary without the MP3 encoder.
mp3 = ["dep:mp3lame-encoder", "dep:id3"]
